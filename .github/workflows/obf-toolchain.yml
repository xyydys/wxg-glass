name: obf-toolchain

# 一次性（或升级时）把 Arkari 混淆工具链编成 Docker 镜像，推到 GHCR。
# 只手动触发：Actions 页面选 obf-toolchain → Run workflow。
# 第一次很慢（在 runner 上从源码编 clang+lld，约 1.5~3 小时），之后出包直接拉镜像。
# 产物：ghcr.io/<owner>/wxg-glass-arkari:latest（私有包，跟仓库同属一个 owner）。

on:
  workflow_dispatch:
    inputs:
      arkari_ref:
        description: 'Arkari git ref（分支或标签）。默认 llvm-20-obf1.9.1；升级可填 llvm-21.x'
        type: string
        default: llvm-20-obf1.9.1

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push toolchain image
        uses: docker/build-push-action@v6
        with:
          context: obfuscation
          file: obfuscation/Dockerfile
          build-args: |
            ARKARI_REF=${{ inputs.arkari_ref }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wxg-glass-arkari:latest
            ghcr.io/${{ github.repository_owner }}/wxg-glass-arkari:${{ inputs.arkari_ref }}
