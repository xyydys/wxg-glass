name: build-deb

# monorepo：插件在 plugin/，本工作流以 plugin/ 为工作目录。
# 普通包：推到 main / 打 v* 标签 / 手动 Run（obfuscate=false）→ build 作业，ubuntu 原生 clang-18。
# 混淆包：手动 Run 且 obfuscate=true → build-obf 作业，跑在 Arkari 工具链镜像里
#         （镜像先用 obf-toolchain 工作流编好推 GHCR）。只对授权/联网文件混淆，渲染热路径不动。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      obfuscate:
        description: '开混淆（需先用 obf-toolchain 工作流把 Arkari 镜像推到 GHCR）'
        type: boolean
        default: false
      obf_flags:
        description: 'Arkari -mllvm flag（默认全套：字符串加密 + 控制流平坦化 + 间接跳转/调用，已真机验过）'
        type: string
        default: '-mllvm -irobf -mllvm -irobf-cse -mllvm -irobf-cff -mllvm -irobf-indbr -mllvm -irobf-icall'
      obf_files:
        description: '混淆这些文件（空格分隔）。默认已含网格后端 WXGGlassView/WXGBackdrop——⚠️这俩有每帧热路径，上机务必测帧率，卡顿就把 WXGGlassView.m 从本行删掉再 Run。'
        type: string
        default: 'Sources/WXGUnlock.m Sources/WXGLicense.m Sources/WXGGlassView.m Sources/WXGBackdrop.m'
      force_authorized:
        description: '自测包：强制「已授权」(-DWXG_FORCE_AUTHORIZED)，复现破解后的状态，仅供自己真机验证加固，切勿外发'
        type: boolean
        default: false
      mesh_off:
        description: '自测包：关掉网格折射 (-DWXG_MESH_OFF)，只看纯着色器观感，装在已授权设备上对比'
        type: boolean
        default: false

permissions:
  contents: write   # 打 tag 时建 Release 用

jobs:
  # ---------- 普通包（push / tag / 手动且不混淆）----------
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.obfuscate }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install clang-18, lld, dpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 dpkg-dev curl
          ls /usr/lib/llvm-18/bin/clang /usr/lib/llvm-18/bin/ld64.lld
      - name: Cache iOS 16.5 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: plugin/toolchain/sdks/iPhoneOS16.5.sdk
          key: ios-sdk-16-5-v1
      - name: Fetch iOS 16.5 SDK (sparse)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain && cd toolchain
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --no-checkout https://github.com/theos/sdks sdks
          cd sdks
          git sparse-checkout init --no-cone
          git sparse-checkout set \
            '/iPhoneOS16.5.sdk/usr/include/' \
            '/iPhoneOS16.5.sdk/usr/lib/' \
            '/iPhoneOS16.5.sdk/System/Library/Frameworks/' \
            '/iPhoneOS16.5.sdk/SDKSettings.*'
          git checkout
          test -d iPhoneOS16.5.sdk/System/Library/Frameworks
      - name: Fetch ldid
        run: |
          curl -sSL -o "$RUNNER_TEMP/ldid" \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x "$RUNNER_TEMP/ldid"
          "$RUNNER_TEMP/ldid" | head -1
      - name: Build .deb
        env:
          SDK: ${{ github.workspace }}/plugin/toolchain/sdks/iPhoneOS16.5.sdk
          # 两个自测开关，仅手动 Run 时可选；push / tag 都为空 → 永远干净正式包。
          FORCE_AUTH: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_authorized) && '1' || '' }}
          MESH_OFF: ${{ (github.event_name == 'workflow_dispatch' && inputs.mesh_off) && '1' || '' }}
        run: |
          export LDID="$RUNNER_TEMP/ldid"
          VER=$(sed -n 's/^Version: *//p' control)
          mkdir -p dist
          EXTRA_CFLAGS=""; SUFFIX=""
          [ -n "$FORCE_AUTH" ] && { EXTRA_CFLAGS="$EXTRA_CFLAGS -DWXG_FORCE_AUTHORIZED=1"; SUFFIX="${SUFFIX}_FORCEAUTH"; }
          [ -n "$MESH_OFF" ]   && { EXTRA_CFLAGS="$EXTRA_CFLAGS -DWXG_MESH_OFF=1";        SUFFIX="${SUFFIX}_MESHOFF"; }
          [ -n "$SUFFIX" ] && echo "::warning::自测包（${SUFFIX}），仅供自己真机验证，切勿外发"
          export EXTRA_CFLAGS
          OUT="dist/com.runyu.wechatliquidglass_${VER}_iphoneos-arm64${SUFFIX}.deb"
          sh tools/build_deb_linux.sh "$GITHUB_WORKSPACE/plugin" "$OUT"
          ls -la dist
          if strings "${OUT%.deb}.dylib" | grep -q "__METAL_VERSION__\|METAL_VERSION"; then
            echo "::error::dylib 里出现了着色器文本，构建中止"; exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatLiquidGlass-deb
          path: plugin/dist/*.deb
          retention-days: 30
      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/dist/*.deb

  # ---------- 混淆包（手动且 obfuscate=true，跑在 Arkari 镜像里）----------
  build-obf:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.obfuscate }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/arkari-ios-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install linker runtime deps (ld64.lld 依赖 libxml2)
        run: apt-get update && apt-get install -y --no-install-recommends libxml2 libzstd1 zlib1g
      - name: Fetch iOS 16.5 SDK (sparse)
        run: |
          mkdir -p toolchain && cd toolchain
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --no-checkout https://github.com/theos/sdks sdks
          cd sdks
          git sparse-checkout init --no-cone
          git sparse-checkout set \
            '/iPhoneOS16.5.sdk/usr/include/' \
            '/iPhoneOS16.5.sdk/usr/lib/' \
            '/iPhoneOS16.5.sdk/System/Library/Frameworks/' \
            '/iPhoneOS16.5.sdk/SDKSettings.*'
          git checkout
          test -d iPhoneOS16.5.sdk/System/Library/Frameworks
      - name: Fetch ldid
        run: |
          curl -sSL -o "$RUNNER_TEMP/ldid" \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x "$RUNNER_TEMP/ldid"
          "$RUNNER_TEMP/ldid" | head -1
      - name: Build .deb (obfuscated, Arkari)
        env:
          SDK: ${{ github.workspace }}/plugin/toolchain/sdks/iPhoneOS16.5.sdk
          CC_DIR: /opt/arkari/bin
          CC: clang
          OBF_FLAGS: ${{ inputs.obf_flags }}
          OBF_FILES: ${{ inputs.obf_files }}
          LD_EXTRA: -Wl,-no_fixup_chains   # 间接跳转/调用混淆会撑爆 chained fixups，关掉它
          EXTRA_CFLAGS: -DWXG_RELEASE=1     # FIX113: 对外发布包关掉日志/诊断（普通 build 不带，照常打日志）
        run: |
          export LDID="$RUNNER_TEMP/ldid"
          echo "混淆 flag: $OBF_FLAGS"
          echo "混淆文件: $OBF_FILES"
          clang --version | head -1
          VER=$(sed -n 's/^Version: *//p' control)
          mkdir -p dist
          OUT="dist/com.runyu.wechatliquidglass_${VER}_iphoneos-arm64_obf.deb"
          sh tools/build_deb_linux.sh "$GITHUB_WORKSPACE/plugin" "$OUT"
          ls -la dist
          if strings "${OUT%.deb}.dylib" | grep -q "__METAL_VERSION__\|METAL_VERSION"; then
            echo "::error::dylib 里出现了着色器文本，构建中止"; exit 1
          fi
          # 自检：服务器地址与公钥的明文都应被 -irobf-cse 加密掉，dylib 里搜不到
          D="${OUT%.deb}.dylib"
          if strings "$D" | grep -q "workers.dev\|xyylwc"; then
            echo "::warning::dylib 里仍能搜到服务器地址明文 —— 确认 -irobf-cse 覆盖了端点"
          else echo "OK：服务器地址已隐藏"; fi
          if strings "$D" | grep -q "73a7b661b9de"; then
            echo "::warning::dylib 里仍能搜到公钥明文 —— -irobf-cse 可能未对 C 字符串生效"
          else echo "OK：公钥已隐藏"; fi
      - name: Upload artifact (obfuscated)
        uses: actions/upload-artifact@v4
        with:
          name: WeChatLiquidGlass-deb-obf
          path: plugin/dist/*.deb
          retention-days: 30
